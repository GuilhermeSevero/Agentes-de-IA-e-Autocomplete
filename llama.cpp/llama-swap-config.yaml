# Grupos para controle de swap (opcional)
groups:
  "coding-models":
    swap: true      # Apenas um modelo por vez neste grupo
    exclusive: true # Descarrega outros grupos quando ativo
    members:
      - "qwen3-coder-30b"
      - "qwen3-14b"
      - "qwen3-8b"
      - "qwen3-4b-instruct"
      - "qwen3-4b-thinking"
      - "gpt-oss-20b"
      - "glm-4.7-flash"
      - "gemma-3-27b-it"
      - "gemma-3-12b-it"
      - "gemma-3-4b-it"
      - "lfm2.5-1.2b-instruct"

# Hooks para pré-carregamento (opcional)
hooks:
  on_startup:
    preload:
      - "gemma-3-4b-it"
