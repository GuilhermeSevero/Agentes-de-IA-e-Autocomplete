# llama-swap YAML configuration

# Configurações globais
healthCheckTimeout: 300
logLevel: info
startPort: 10001

# Macros para reutilização
macros:
  llama-server: "./llama.cpp/build/bin/llama-server"

# Modelos disponíveis
models:
  # Modelo: Qwen3-Coder-30B-A3B-Instruct
  "qwen3-coder-30b":
    name: "Qwen3-Coder-30B-A3B-Instruct"
    description: "Modelo de codificação de 30B parâmetros com instruções otimizadas"
    cmd: |
      ${llama-server}
      -hf unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:UD-Q4_K_XL
      --alias unsloth/qwen3-coder-30b-a3b
      --host 0.0.0.0
      --port ${PORT}
      --jinja
      --n-gpu-layers 26
      --ctx-size 65536
      --temp 0.7
      --top-k 20
      --min-p 0.00
      --top-p 0.8
      --repeat-penalty 1.05
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 2048
      --ubatch-size 512
      --threads 14
      --threads-batch 14
      --cont-batching
      --split-mode none
      --main-gpu 0
      --no-mmap
    proxy: "http://localhost:${PORT}"
    aliases:
      - "qwen3-coder-30b-a3b"
      - "unsloth/qwen3-coder-30b-a3b"
    checkEndpoint: "/health"
    ttl: 3600  # 1 hora de TTL

